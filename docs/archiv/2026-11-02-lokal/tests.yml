name: Tests

# Version 2026-11-02-b: kein Überspringen mehr im Entwurf.
#
# Wann läuft dieser Workflow?
# - an jedem PR gegen main, bei jedem Push, auch im Entwurf
# - nach jedem Commit auf main, außer reine .md-Änderungen
#
# Warum kein Überspringen im Entwurf: GitHub zählt einen übersprungenen Job als bestanden.
# Dann wäre ein PR kurz nach "bereit" mergebar, ohne dass Tests gelaufen sind (Test T4b).
# So hat jeder Stand ein echtes Ergebnis.
#
# Die Text-Erkennung ist vorsichtig: Kann sie die Änderungen nicht sicher bestimmen,
# laufen die Tests. Nur bei nachweislich ausschließlich .md-Dateien entfallen sie.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  # PR: überholte Läufe abbrechen. main: jeder Commit eigene Gruppe, nichts wird abgebrochen.
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Workflow-Version belegen
        shell: bash
        run: |
          echo "Workflow-Version: tests.yml 2026-11-02-b"
          echo "Geprüfter Stand: ${{ github.sha }}"
          echo "Prüfsumme der ausgeführten Datei:"
          tr -d '\r' < .github/workflows/tests.yml | sha256sum

      - name: Nur .md-Dateien geändert?
        id: art
        shell: bash
        run: |
          set -uo pipefail
          code=ja
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if dateien=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"); then
              if [ -n "$dateien" ] && ! printf '%s\n' "$dateien" | grep -qvE '\.md$'; then
                code=nein
              fi
            else
              echo "Änderungen nicht bestimmbar, Tests laufen sicherheitshalber."
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Tests laufen: $code"

      - uses: actions/setup-node@v4
        if: steps.art.outputs.code == 'ja'
        with:
          node-version: 20

      - name: Tests
        if: steps.art.outputs.code == 'ja'
        run: npm test
