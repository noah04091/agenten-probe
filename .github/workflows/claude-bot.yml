
# Claude-Bot: Sicherheitsprobe
# Phase 2: GitHub-Issue lesen, ohne Claude oder Schreibrechte.

name: Claude-Bot Sicherheitsprobe

on:
  push:
    branches:
      - wp/26-cloud-agent
    paths:
      - .github/workflows/claude-bot.yml

# Nur Lesezugriff auf GitHub-Issues.
# Alle anderen Repository-Rechte sind deaktiviert.
permissions:
  issues: read

jobs:
  sicherheitsprobe:
    name: Sicherheitsprobe
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Sicherheitsbedingungen pruefen
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = "noah04091/agenten-probe"
          test "$GITHUB_REF" = "refs/heads/wp/26-cloud-agent"

          echo "Repository und Branch korrekt."

      - name: GitHub-Issue 26 nur lesend pruefen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          NUMMER="$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/26" \
            --jq '.number')"

          STATUS="$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/26" \
            --jq '.state')"

          test "$NUMMER" = "26"
          test "$STATUS" = "open"

          echo "GitHub-Issue #26 erfolgreich gelesen."
          echo "Status: $STATUS"
          echo "Keine Repository-Aenderungen vorgenommen."
          echo "Kein Claude-API-Aufruf."
