name: Tests

# Version 2026-11-03-a
# Laeuft bei jedem PR gegen main und bei jedem Push auf main. Keine Sonderlogik fuer Dateitypen.
# Ein fehlschlagender Schritt macht den Job "tests" rot.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read   # nur Lesen fuer den Checkout

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout ohne gespeicherte Zugangsdaten
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflow-Version belegen und Git-Zugangsdaten-Konfiguration suchen
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow-Version: tests.yml 2026-11-03-a"
          echo "Gepruefter Stand: ${GITHUB_SHA}"
          tr -d '\r' < .github/workflows/tests.yml | sha256sum
          # Misst nur: sieht git (inkl. eingebundener Dateien) einen Auth-Header oder Credential-Helper?
          gefunden="$(git config --includes --show-origin --get-regexp '^(http\..*\.extraheader|credential\..*|include\.path|includeif\..*)$' || true)"
          if [ -n "$gefunden" ]; then
            echo "FEHLER: Git-Zugangsdaten-Konfiguration gefunden:"
            printf '%s\n' "$gefunden" | sed -E 's/(AUTHORIZATION: basic ).*/\1***/I'
            exit 1
          fi
          echo "Keine Git-Zugangsdaten-Konfiguration gefunden."

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tests
        shell: bash
        run: npm test
