name: Agent-Pruefer-KI

# B2.3a Freigabeschranke, ohne KI-Aufruf. Ziel .github/workflows/agent-pruefer-ki.yml.
#
# Nach einer erfolgreichen Vorpruefung (Workflow "Agent-Vorpruefung") fragt dieser Workflow Noahs Freigabe an, aber
# nur fuer einen fachlich pruefbaren Gegenstand. In B2.3a laeuft nach der Freigabe nur eine Logzeile.
# - Job schranke_vorpruefung: kein Environment, nur actions: read und pull-requests: read. Prueft die Einstellungen
#   des Environments, den Quelllauf der Vorpruefung, dessen Job und Logzeile, den offenen PR und ob derselbe
#   Pruefumfang (PR und Kopf) in irgendeinem Versuch irgendeines Laufs schon freigegeben wurde. Jede Abweichung und
#   jede nicht lesbare Antwort: eine Logzeile "keine-anfrage" mit festem Grund, Exitcode 1, keine Freigabeanfrage.
# - Job schranke: Environment mit Pflichtpruefer, keine Rechte, kein Token. Schreibt nach der Freigabe genau eine Zeile.
#   Er laeuft nur im selben Versuch wie ein bestandener Vorjob (Ausgabe versuch). Wird nur er erneut gestartet, traegt
#   der uebernommene Vorjob den alten Versuch, und der Job wird vor der Freigabeanfrage uebersprungen.
# Kein Checkout, keine Action, kein Secret, keine Variable. Alle Werte nur ueber env.
# Notabschaltung: diesen Workflow in GitHub deaktivieren und wartende Freigaben ablehnen (Betriebsdoku Abschnitt 5).

on:
  workflow_run:
    workflows: [Agent-Vorpruefung]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      lauf:
        description: Lauf-ID der Vorpruefung
        required: true
        type: string
      versuch:
        description: Versuch (run_attempt) dieses Laufs
        required: true
        type: string

permissions: {}

concurrency:
  group: agent-pruefer-ki
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  schranke_vorpruefung:
    if: >-
      github.repository == 'noah04091/agenten-probe' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.workflow_id == 429024670 &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch')) ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'noah04091' &&
        github.triggering_actor == 'noah04091'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    outputs:
      quelle: ${{ steps.pruefung.outputs.quelle }}
      auftrag: ${{ steps.pruefung.outputs.auftrag }}
      pr: ${{ steps.pruefung.outputs.pr }}
      kopf: ${{ steps.pruefung.outputs.kopf }}
      versuch: ${{ steps.pruefung.outputs.versuch }}
    steps:
      - name: Environment, Gegenstand und Doppelsperre pruefen
        id: pruefung
        env:
          GH_TOKEN: ${{ github.token }}
          A6_KI_EREIGNIS: ${{ github.event_name }}
          A6_KI_LAUF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.lauf }}
          A6_KI_VERSUCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.versuch }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          REPO=noah04091/agenten-probe
          API="repos/$REPO"
          UMGEBUNG=claude-pruefer
          QUELLE=unbekannt
          ABRUFE=0
          ordner="$(mktemp -d "${RUNNER_TEMP:?}/a6-ki.XXXXXX")"

          stopp() {
            echo "A6-PRUEFER-SCHRANKE repo $REPO quelle $QUELLE ergebnis keine-anfrage grund $1"
            exit 1
          }

          # Ein GET mit fester Obergrenze. Antwort in Datei $2, Fehlertext in $2.err. Kein Aufruf in einer Subshell,
          # damit der Zaehler gilt.
          api() {
            ABRUFE=$((ABRUFE + 1))
            if (( ABRUFE > 400 )); then stopp zu-viele-abfragen; fi
            gh api --method GET -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$1" > "$2" 2> "$2.err"
          }

          log_holen() {
            ABRUFE=$((ABRUFE + 1))
            if (( ABRUFE > 400 )); then stopp zu-viele-abfragen; fi
            gh api --method GET --allow-escape-sequences "$API/actions/jobs/$1/logs" > "$2" 2> "$2.err"
          }

          # Kandidaten wie die Zentrale (daten.mjs prueferZeile): BOM am Anfang ab, CR am Zeilenende ab, Zeitstempel ab,
          # nur Zeilen, die danach direkt mit dem Praefix und einem Leerzeichen beginnen.
          kandidaten() {
            sed -E -e '1s/^\xEF\xBB\xBF//' -e 's/\r$//' -e 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z //' -- "$1" | grep -a -- "^$2 " || true
          }

          zu_gross() { [[ "$(stat -c %s -- "$1")" -gt 16777216 ]]; }

          # 0. Quelle: Ereignis und Format, vor jedem Abruf.
          [[ "$A6_KI_EREIGNIS" == workflow_run || "$A6_KI_EREIGNIS" == workflow_dispatch ]] || stopp quelle-format
          [[ "$A6_KI_LAUF" =~ ^[1-9][0-9]{0,15}$ && "$A6_KI_VERSUCH" =~ ^[1-9][0-9]{0,2}$ ]] || stopp quelle-format
          [[ "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]{0,15}$ && "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]{0,2}$ ]] || stopp quelle-format
          LAUF="$A6_KI_LAUF"
          VERSUCH="$A6_KI_VERSUCH"
          QUELLE="$LAUF-$VERSUCH"

          # 1. Environment gegen das vollstaendige Soll. Ein fehlendes Feld gilt nie als false.
          if ! api "$API/environments/$UMGEBUNG" "$ordner/env.json"; then
            if grep -q '(HTTP 404)' "$ordner/env.json.err"; then stopp konfig-fehlt; fi
            stopp konfig-nicht-lesbar
          fi
          if ! api "$API/environments/$UMGEBUNG/deployment-branch-policies" "$ordner/zweige.json"; then
            if grep -q '(HTTP 404)' "$ordner/zweige.json.err"; then stopp konfig-fehlt; fi
            stopp konfig-nicht-lesbar
          fi
          jq -e 'type == "object"' "$ordner/env.json" > /dev/null 2>&1 || stopp konfig-nicht-lesbar
          jq -e 'type == "object"' "$ordner/zweige.json" > /dev/null 2>&1 || stopp konfig-nicht-lesbar
          jq -e --arg name "$UMGEBUNG" '
            .id == 28418332669 and .name == $name and .can_admins_bypass == false
            and (.deployment_branch_policy == {"protected_branches": false, "custom_branch_policies": true})
            and (.protection_rules | type == "array" and length == 2)
            and ([.protection_rules[] | .type] | sort == ["branch_policy", "required_reviewers"])
            and ([.protection_rules[] | select(.type == "required_reviewers")][0]
                 | (.reviewers | type == "array" and length == 1)
                   and .reviewers[0].type == "User" and .reviewers[0].reviewer.id == 196186596)
          ' "$ordner/env.json" > /dev/null 2>&1 || stopp konfig-abweichung
          jq -e '
            .total_count == 1 and (.branch_policies | type == "array" and length == 1)
            and .branch_policies[0].name == "main" and .branch_policies[0].type == "branch"
          ' "$ordner/zweige.json" > /dev/null 2>&1 || stopp konfig-abweichung

          # 2. Quelllauf der Vorpruefung.
          api "$API/actions/runs/$LAUF" "$ordner/lauf.json" || stopp quelle-nicht-lesbar
          jq -e 'type == "object"' "$ordner/lauf.json" > /dev/null 2>&1 || stopp quelle-nicht-lesbar
          jq -e --arg lauf "$LAUF" --arg repo "$REPO" '
            (.id | tostring) == $lauf and .workflow_id == 429024670
            and .path == ".github/workflows/agent-pruefer.yml" and .head_branch == "main"
            and .repository.full_name == $repo and .head_repository.full_name == $repo
            and (.event == "workflow_run" or .event == "workflow_dispatch")
            and (.event != "workflow_dispatch" or .triggering_actor.login == "noah04091")
          ' "$ordner/lauf.json" > /dev/null 2>&1 || stopp quelle-herkunft
          jq -e '.status == "completed" and .conclusion == "success"' "$ordner/lauf.json" > /dev/null 2>&1 || stopp quelle-nicht-erfolgreich
          jq -e --arg v "$VERSUCH" '(.run_attempt | tostring) == $v' "$ordner/lauf.json" > /dev/null 2>&1 || stopp veralteter-versuch

          # 3. Job "Vorpruefung Agenten-PR" genau dieses Versuchs.
          api "$API/actions/runs/$LAUF/attempts/$VERSUCH/jobs?per_page=100" "$ordner/jobs.json" || stopp quelle-nicht-lesbar
          jq -e '(.jobs | type == "array") and .total_count == (.jobs | length)' "$ordner/jobs.json" > /dev/null 2>&1 || stopp quelle-nicht-lesbar
          anzahl="$(jq '[.jobs[] | select(.name == "Vorpruefung Agenten-PR")] | length' "$ordner/jobs.json")"
          [[ "$anzahl" != 0 ]] || stopp job-fehlt
          [[ "$anzahl" == 1 ]] || stopp job-mehrdeutig
          jq -e --arg v "$VERSUCH" '.jobs[] | select(.name == "Vorpruefung Agenten-PR")
            | (.run_attempt | tostring) == $v and .status == "completed" and .conclusion == "success"' "$ordner/jobs.json" > /dev/null 2>&1 || stopp job-nicht-erfolgreich
          job="$(jq -r '.jobs[] | select(.name == "Vorpruefung Agenten-PR") | .id' "$ordner/jobs.json")"
          [[ "$job" =~ ^[1-9][0-9]{0,15}$ ]] || stopp job-nicht-erfolgreich

          # 4. Logzeile A6-PRUEFER, Regeln der Zentrale wortgleich.
          log_holen "$job" "$ordner/job.log" || stopp log-nicht-lesbar
          ! zu_gross "$ordner/job.log" || stopp log-nicht-lesbar
          mapfile -t zeilen < <(kandidaten "$ordner/job.log" A6-PRUEFER)
          [[ "${#zeilen[@]}" != 0 ]] || stopp zeile-fehlt
          [[ "${#zeilen[@]}" == 1 ]] || stopp zeile-mehrdeutig
          zeile="${zeilen[0]}"
          if [[ "$zeile" =~ ^A6-PRUEFER\ kein\ Agenten-Auftrag\ lauf\ ([1-9][0-9]{0,15}|unbekannt)\ code\ quelle-kein-auftrag$ ]]; then
            stopp kein-auftrag
          fi
          muster='^A6-PRUEFER repo noah04091/agenten-probe pr ([1-9][0-9]{0,7}|unbekannt) kopf ([0-9a-f]{40}|unbekannt) basis ([0-9a-f]{40}|unbekannt) lauf ([1-9][0-9]{0,15}|unbekannt) ergebnis ([a-z-]{1,40}) befunde ([0-9]{1,4}) hinweise ([0-9]{1,4})$'
          [[ "$zeile" =~ $muster ]] || stopp zeile-ungueltig
          PR="${BASH_REMATCH[1]}"
          KOPF="${BASH_REMATCH[2]}"
          AUFTRAG="${BASH_REMATCH[4]}"
          ERGEBNIS="${BASH_REMATCH[5]}"
          case "$ERGEBNIS" in
            auffaelligkeiten|keine-auffaelligkeiten) ;;
            nicht-pruefbar) stopp nicht-pruefbar ;;
            ausstehend) stopp ausstehend ;;
            *) stopp zeile-ungueltig ;;
          esac
          [[ "$PR" != unbekannt && "$KOPF" != unbekannt ]] || stopp pr-unbekannt
          [[ "$AUFTRAG" != unbekannt ]] || stopp zeile-ungueltig

          # 5. Offener PR der App mit genau diesem Kopf.
          api "$API/pulls/$PR" "$ordner/pr.json" || stopp pr-nicht-lesbar
          jq -e 'type == "object"' "$ordner/pr.json" > /dev/null 2>&1 || stopp pr-nicht-lesbar
          jq -e '.state == "open"' "$ordner/pr.json" > /dev/null 2>&1 || stopp pr-nicht-offen
          jq -e --arg kopf "$KOPF" '.head.sha == $kopf' "$ordner/pr.json" > /dev/null 2>&1 || stopp kopf-geaendert
          jq -e --arg pr "$PR" --arg repo "$REPO" --arg auftrag "$AUFTRAG" '
            (.number | tostring) == $pr and .base.ref == "main" and .head.repo.full_name == $repo
            and .user.login == "noah04091-agenten-probe-cloud-bot[bot]" and .user.type == "Bot"
            and (.head.ref | type == "string" and test("^wp/[1-9][0-9]{0,7}-agent-" + $auftrag + "-1$"))
          ' "$ordner/pr.json" > /dev/null 2>&1 || stopp pr-herkunft

          # 6. Doppelsperre: jeder Versuch jedes Laufs dieses Workflows, auch die frueheren Versuche des eigenen.
          api "$API/actions/workflows/agent-pruefer-ki.yml/runs?per_page=100" "$ordner/laeufe.json" || stopp verlauf-nicht-lesbar
          jq -e '(.workflow_runs | type == "array") and (.total_count | type == "number")' "$ordner/laeufe.json" > /dev/null 2>&1 || stopp verlauf-nicht-lesbar
          jq -e '.total_count <= 100' "$ordner/laeufe.json" > /dev/null 2>&1 || stopp zu-viele-laeufe
          jq -e '.total_count == (.workflow_runs | length)' "$ordner/laeufe.json" > /dev/null 2>&1 || stopp verlauf-unvollstaendig
          jq -e --arg ich "$GITHUB_RUN_ID" '[.workflow_runs[] | select((.id | tostring) == $ich)] | length == 1' "$ordner/laeufe.json" > /dev/null 2>&1 || stopp verlauf-widerspruch
          jq -e --arg ich "$GITHUB_RUN_ID" '[.workflow_runs[] | select((.id | tostring) != $ich)
            | select(.status == "in_progress" or .status == "waiting" or .status == "requested")] | length == 0' "$ordner/laeufe.json" > /dev/null 2>&1 || stopp parallel-lauf
          mapfile -t laeufe < <(jq -r '.workflow_runs[] | "\(.id) \(.run_attempt)"' "$ordner/laeufe.json")
          schranke_muster='^A6-PRUEFER-SCHRANKE repo noah04091/agenten-probe quelle [1-9][0-9]{0,15}-[1-9][0-9]{0,2} auftrag [1-9][0-9]{0,15} pr ([1-9][0-9]{0,7}) kopf ([0-9a-f]{40}) workflow-sha [0-9a-f]{40} ereignis (workflow_run|workflow_dispatch) freigegeben$'
          for eintrag in "${laeufe[@]}"; do
            id="${eintrag% *}"
            bis="${eintrag#* }"
            [[ "$id" =~ ^[1-9][0-9]{0,15}$ && "$bis" =~ ^[1-9][0-9]{0,2}$ ]] || stopp verlauf-widerspruch
            hoechst="$bis"
            if [[ "$id" == "$GITHUB_RUN_ID" ]]; then bis=$((GITHUB_RUN_ATTEMPT - 1)); hoechst="$GITHUB_RUN_ATTEMPT"; fi
            summe=0
            : > "$ordner/erfolge-$id"
            for ((n = 1; n <= bis; n++)); do
              api "$API/actions/runs/$id/attempts/$n" "$ordner/v.json" || stopp verlauf-nicht-lesbar
              jq -e 'type == "object"' "$ordner/v.json" > /dev/null 2>&1 || stopp verlauf-nicht-lesbar
              jq -e --arg id "$id" --argjson n "$n" '(.id | tostring) == $id and .run_attempt == $n' "$ordner/v.json" > /dev/null 2>&1 || stopp verlauf-widerspruch
              api "$API/actions/runs/$id/attempts/$n/jobs?per_page=100" "$ordner/vj.json" || stopp verlauf-nicht-lesbar
              jq -e '(.jobs | type == "array") and (.total_count | type == "number")' "$ordner/vj.json" > /dev/null 2>&1 || stopp verlauf-nicht-lesbar
              jq -e --argjson n "$n" '.total_count == (.jobs | length) and all(.jobs[]; .run_attempt == $n)' "$ordner/vj.json" > /dev/null 2>&1 || stopp verlauf-widerspruch
              summe=$((summe + $(jq '.jobs | length' "$ordner/vj.json")))
              mapfile -t erfolge < <(jq -r '.jobs[] | select(.name == "schranke" and .conclusion == "success") | .id' "$ordner/vj.json")
              (( ${#erfolge[@]} <= 1 )) || stopp verlauf-widerspruch
              for ej in "${erfolge[@]}"; do
                [[ "$ej" =~ ^[1-9][0-9]{0,15}$ ]] || stopp verlauf-widerspruch
                echo "$ej" >> "$ordner/erfolge-$id"
                log_holen "$ej" "$ordner/s.log" || stopp verlauf-nicht-lesbar
                ! zu_gross "$ordner/s.log" || stopp verlauf-nicht-lesbar
                mapfile -t sz < <(kandidaten "$ordner/s.log" A6-PRUEFER-SCHRANKE)
                [[ "${#sz[@]}" == 1 && "${sz[0]}" =~ $schranke_muster ]] || stopp verlauf-widerspruch
                if [[ "${BASH_REMATCH[1]}" == "$PR" && "${BASH_REMATCH[2]}" == "$KOPF" ]]; then stopp bereits-freigegeben; fi
              done
            done
            # Gegenprobe ueber filter=all: alle Jobs aller Versuche; jeder frueher erfolgreiche Schrankenjob muss oben
            # gelesen worden sein, die Zahl der Jobs der geprueften Versuche muss stimmen.
            api "$API/actions/runs/$id/jobs?filter=all&per_page=100" "$ordner/alle.json" || stopp verlauf-nicht-lesbar
            jq -e '(.jobs | type == "array") and (.total_count | type == "number")' "$ordner/alle.json" > /dev/null 2>&1 || stopp verlauf-nicht-lesbar
            jq -e --argjson bis "$bis" --argjson hoechst "$hoechst" --argjson summe "$summe" --rawfile gelesen "$ordner/erfolge-$id" '
              .total_count == (.jobs | length)
              and all(.jobs[]; (.run_attempt | type == "number") and .run_attempt >= 1 and .run_attempt <= $hoechst)
              and ([.jobs[] | select(.run_attempt <= $bis)] | length) == $summe
              and ([.jobs[] | select(.name == "schranke" and .conclusion == "success") | .id | tostring] - ($gelesen | split("\n") | map(select(. != ""))) | length) == 0
            ' "$ordner/alle.json" > /dev/null 2>&1 || stopp verlauf-widerspruch
          done

          {
            echo "quelle=$QUELLE"
            echo "auftrag=$AUFTRAG"
            echo "pr=$PR"
            echo "kopf=$KOPF"
            echo "versuch=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          echo "A6-PRUEFER-SCHRANKE repo $REPO quelle $QUELLE auftrag $AUFTRAG pr $PR kopf $KOPF ergebnis anfrage"

  schranke:
    needs: schranke_vorpruefung
    if: >-
      github.repository == 'noah04091/agenten-probe' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.workflow_id == 429024670 &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch')) ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'noah04091' &&
        github.triggering_actor == 'noah04091')) &&
      needs.schranke_vorpruefung.result == 'success' &&
      needs.schranke_vorpruefung.outputs.versuch == format('{0}', github.run_attempt)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment:
      name: claude-pruefer
    permissions: {}
    steps:
      - name: Freigabe protokollieren
        env:
          A6_KI_EREIGNIS: ${{ github.event_name }}
          A6_KI_QUELLE: ${{ needs.schranke_vorpruefung.outputs.quelle }}
          A6_KI_AUFTRAG: ${{ needs.schranke_vorpruefung.outputs.auftrag }}
          A6_KI_PR: ${{ needs.schranke_vorpruefung.outputs.pr }}
          A6_KI_KOPF: ${{ needs.schranke_vorpruefung.outputs.kopf }}
          A6_KI_VORJOB_VERSUCH: ${{ needs.schranke_vorpruefung.outputs.versuch }}
        run: |
          set -euo pipefail
          # Nur im selben Versuch wie der bestandene Vorjob (zweite Sperre hinter der Bedingung des Jobs).
          [[ "${A6_KI_VORJOB_VERSUCH:-}" =~ ^[1-9][0-9]{0,2}$ && "${GITHUB_RUN_ATTEMPT:-}" == "$A6_KI_VORJOB_VERSUCH" ]] || { echo "A6-START versuch" >&2; exit 1; }
          [[ "$A6_KI_QUELLE" =~ ^[1-9][0-9]{0,15}-[1-9][0-9]{0,2}$ ]] || { echo "A6-START quelle" >&2; exit 1; }
          [[ "$A6_KI_AUFTRAG" =~ ^[1-9][0-9]{0,15}$ ]] || { echo "A6-START auftrag" >&2; exit 1; }
          [[ "$A6_KI_PR" =~ ^[1-9][0-9]{0,7}$ ]] || { echo "A6-START pr" >&2; exit 1; }
          [[ "$A6_KI_KOPF" =~ ^[0-9a-f]{40}$ ]] || { echo "A6-START kopf" >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A6-START workflow-sha" >&2; exit 1; }
          [[ "$A6_KI_EREIGNIS" == workflow_run || "$A6_KI_EREIGNIS" == workflow_dispatch ]] || { echo "A6-START ereignis" >&2; exit 1; }
          echo "A6-PRUEFER-SCHRANKE repo noah04091/agenten-probe quelle $A6_KI_QUELLE auftrag $A6_KI_AUFTRAG pr $A6_KI_PR kopf $A6_KI_KOPF workflow-sha $GITHUB_SHA ereignis $A6_KI_EREIGNIS freigegeben"
