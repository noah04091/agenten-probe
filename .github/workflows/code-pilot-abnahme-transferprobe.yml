
# Code-Pilot: Vollstaendige Abnahme-Transferprobe.
# Simuliert eine korrekte Codeaenderung ohne Claude.
# Zwei getrennte Runner, keine Secrets, keine Schreibrechte.
# Keine Branches, Pull Requests oder automatischen Merges.

name: Code-Pilot Abnahme-Transferprobe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: code-pilot-abnahme-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paket_erstellen:
    name: Korrekte Codeaenderung simulieren

    if: >-
      github.repository == 'noah04091/agenten-probe' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'wp/26-agent-code-pilot' &&
      github.event.pull_request.user.login == 'noah04091'

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Repository laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Node 24 einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Korrekte Multiplikation lokal simulieren
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = "noah04091/agenten-probe"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          node <<'NODE'
          const fs = require('node:fs');

          const file = 'src/rechne.js';
          const original = fs.readFileSync(file, 'utf8');
          const marker =
            'module.exports = { addiere, subtrahiere };';

          if (!original.includes(marker) ||
              original.includes('function multipliziere(')) {
            throw new Error('Unerwarteter Ausgangsstand');
          }

          const replacement = [
            'function multipliziere(a, b) {',
            '  return a * b;',
            '}',
            '',
            'module.exports = { addiere, subtrahiere, multipliziere };',
          ].join('\n');

          fs.writeFileSync(
            file,
            original.replace(marker, replacement)
          );

          fs.appendFileSync(
            'test/rechne.test.js',
            [
              '',
              "test('Multiplikation funktioniert', () => {",
              "  const { multipliziere } = require('../src/rechne');",
              '  assert.strictEqual(multipliziere(3, -4), -12);',
              '});',
              '',
            ].join('\n')
          );
          NODE

          echo "base_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

          node scripts/agent-code-package.mjs create "$GITHUB_SHA"
          test -s "$RUNNER_TEMP/code-pilot-package.json"

          echo "Simuliertes Codepaket erfolgreich erstellt."

      - name: Codepaket hochladen
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: code-pilot-abnahme-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/code-pilot-package.json
          if-no-files-found: error
          retention-days: 1

  paket_pruefen:
    name: Codepaket unabhaengig abnehmen
    needs: paket_erstellen

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions: {}

    env:
      BASE_SHA: ${{ needs.paket_erstellen.outputs.base_sha }}
      IMAGE: node@sha256:8fa96264f302f58bbb13aa7339c541547b56975766ce956c875da149452a3e40

    steps:
      - name: Frische Arbeitskopie laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Node 24 einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Paket per Artefakt-ID herunterladen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.paket_erstellen.outputs.artifact_id }}
          path: ${{ runner.temp }}
          digest-mismatch: error

      - name: Paket unabhaengig ueberpruefen
        shell: bash
        run: |
          set -euo pipefail

          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$BASE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -s "$RUNNER_TEMP/code-pilot-package.json"

          node scripts/agent-code-package.mjs apply "$BASE_SHA"
          git diff --check

          echo "Codepaket erfolgreich uebernommen."

      - name: Festgelegtes Docker-Image laden
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

      - name: Unabhaengige Abnahme isoliert ausfuehren
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --pull=never \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 512m \
            --cpus 1 \
            --user 1000:1000 \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" \
            --workdir /work \
            --env HOME=/tmp \
            --env NPM_CONFIG_CACHE=/tmp/npm-cache \
            --env CI=true \
            "$IMAGE" \
            bash -euo pipefail -c '
              test -z "${GH_TOKEN:-}"
              test -z "${GITHUB_TOKEN:-}"
              test -z "${ANTHROPIC_API_KEY:-}"
              test -z "${BOT_APP_PRIVATE_KEY:-}"

              test ! -S /var/run/docker.sock

              npm test
              node scripts/agent-code-acceptance.mjs
              npm run build

              echo "Code-Pilot Abnahme erfolgreich."
            '

      - name: Sicheren Abschluss bestaetigen
        shell: bash
        run: |
          set -euo pipefail

          echo "Zwei getrennte Runner erfolgreich."
          echo "Paket unabhaengig validiert."
          echo "110 Rechenfaelle im Docker-Container bestanden."
          echo "Keine GitHub-Schreibrechte."
          echo "Keine Veroeffentlichung."
          echo "Kein automatischer Merge."
